<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Job Book">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="jspdf.umd.min.js"></script>
<title>HVAC Job Book</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#0f172a; --muted:#556070; --line:#e2e8f0;
    --heat:#d6203f; --cool:#2563eb; --maint:#6d3fd6;
    --accent:#d6203f; --navy:#2563eb;
    --red:#b0172f; --amber:#8a5a00; --blue:#1d4fc4; --green:#15803d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font:17px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  #upd{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));width:calc(100% - 28px);max-width:532px;z-index:15;background:var(--ink);color:#fff;border-radius:20px;padding:12px 12px 12px 16px;align-items:center;gap:12px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
  #upd.on{display:flex}
  #upd .mid{flex:1;min-width:0}
  #upd b{display:block;font-size:16px}
  #upd span{font-size:13px;color:#c3cad4;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #upd a{background:var(--accent);color:#fff;text-decoration:none;font-weight:800;font-size:15px;border-radius:12px;padding:11px 14px;white-space:nowrap}
  #upd button{background:none;border:0;color:#94a3b8;font-size:18px;width:32px;height:32px}
  #banner{display:none;background:#fff4e5;color:#7a4510;font-size:14px;padding:8px 16px;border-bottom:1px solid #f3d7b5}
  main{padding:env(safe-area-inset-top) 14px 120px;max-width:560px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;padding:18px 4px 12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:42px;height:42px;flex-shrink:0;border-radius:13px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
  .brand .sub{font-size:13px;color:var(--muted)}
  .brand .nm{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .round{width:44px;height:44px;flex-shrink:0;border-radius:99px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .top-btns{display:flex;gap:8px}
  h2.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;font-weight:900;letter-spacing:-.01em;margin:22px 4px 10px}
  h2.sec .link{font-size:15px;font-weight:700;color:var(--navy);background:none;border:0;padding:0}
  h2.sec .cnt{font-size:14px;color:var(--muted);font-weight:600}
  h1.page{font-size:26px;font-weight:900;letter-spacing:-.01em;margin:18px 4px 12px}

  /* hero */
  .hero{border-radius:26px;overflow:hidden;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.18)}
  .hero svg{display:block;width:100%;height:auto}
  .hero .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
  .kindrow{display:flex;justify-content:space-between;align-items:center}
  .kindlab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  .kic{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
  .kic svg{width:16px;height:16px}
  .hero .time{font-size:22px;font-weight:900}
  .hero .who{font-size:28px;font-weight:900;letter-spacing:-.01em;margin-top:4px;background:none;border:0;color:#fff;padding:0;text-align:left}
  .hero .what{font-size:16px}
  .addr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
  .addr span:first-child{font-size:14px;opacity:.92}
  .tag{font-size:13px;font-weight:800;background:rgba(255,255,255,.22);border-radius:99px;padding:5px 10px;white-space:nowrap}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .acts a,.acts button{height:50px;border-radius:14px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
  .acts .solid{background:#fff}
  .acts svg{width:18px;height:18px}
  .hero.empty{background:var(--ink);padding:22px 18px}
  .hero.empty .big{font-size:24px;font-weight:900}
  .hero.empty p{margin:6px 0 14px;color:#c3cad4}

  /* stacked color cards */
  .stack{display:flex;flex-direction:column}
  .scard{display:block;width:100%;text-align:left;border:0;color:#fff;border-radius:22px;padding:14px 16px 30px;margin-bottom:-16px;box-shadow:0 -4px 14px rgba(0,0,0,.12);position:relative}
  .scard:last-child{margin-bottom:0;padding-bottom:16px}
  .scard .t{font-size:19px;font-weight:900}
  .scard .nm{font-size:22px;font-weight:900}
  .scard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px}
  .scard .p{font-size:15px;margin-top:2px}
  .scard .a{font-size:14px;opacity:.9;margin-top:2px}

  /* white list */
  .list{background:#fff;border-radius:20px;overflow:hidden}
  .li{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid #eef1f5;background:none;width:100%;text-align:left}
  .li:last-child{border-bottom:0}
  .num{width:42px;height:42px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}
  .li .mid{flex:1;display:flex;flex-direction:column;min-width:0}
  .li .mid b{font-size:16px;font-weight:800}
  .li .mid span{font-size:14px;color:var(--muted)}
  .chev{width:20px;height:20px;flex-shrink:0;color:#94a3b8}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .tile{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px;border:0;text-align:left}
  .tile.dark{background:var(--ink);color:#fff}
  .tile small{font-size:13px;font-weight:700;color:var(--muted)}
  .tile.dark small{color:#c3cad4}
  .tile b{font-size:24px;font-weight:900}

  /* job cards (white) */
  .card{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px}
  .jcard{display:flex;gap:12px;width:100%;text-align:left;border:0;background:#fff;border-radius:18px;padding:13px;margin-bottom:10px}
  .ktile{width:46px;height:46px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff}
  .ktile svg{width:24px;height:24px}
  .jcard .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .jcard .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .jcard .nm{font-size:18px;font-weight:800}
  .jcard .p{font-size:15px}
  .jcard .s{font-size:14px;color:var(--muted)}
  .pill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
  .s-new{background:#e3ecff;color:var(--blue)}
  .s-scheduled{background:#fff1d6;color:var(--amber)}
  .s-done{background:#ffe4e8;color:var(--red)}
  .s-paid{background:#dcfce7;color:var(--green)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
  .chip{border:0;background:#fff;border-radius:99px;padding:9px 15px;font-size:15px;font-weight:600;white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff}
  .search{width:100%;padding:13px 15px;border:0;border-radius:14px;background:#fff;margin-bottom:10px;font-size:17px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .muted{color:var(--muted)}
  .hint{font-size:14px;color:var(--muted);margin:6px 4px}

  /* schedule */
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .datebar .arrow{width:50px;height:50px;border-radius:14px;border:0;background:#fff;font-size:24px}
  .datebar .mid{flex:1;text-align:center}
  .datebar .big{font-weight:900;font-size:20px}
  .datebar .sm{font-size:14px;color:var(--muted)}
  .whead{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}
  .whead b{font-size:18px;font-weight:800}

  /* money */
  .owed{background:var(--ink);color:#fff;border-radius:24px;padding:18px}
  .owed small{color:#c3cad4;font-size:14px;font-weight:600}
  .owed .amt{font-size:38px;font-weight:900;letter-spacing:-.01em;line-height:1.1}
  .money{font-weight:900;font-variant-numeric:tabular-nums}

  /* buttons */
  .btn{border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:800;background:var(--ink);color:#fff;width:100%}
  .btn:active{opacity:.85}
  .btn.accent{background:var(--accent)}
  .btn.green{background:var(--green)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #cbd5e1}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid #f1b5b5}
  .btn.small{width:auto;padding:10px 14px;font-size:15px}
  .btns{display:grid;gap:10px;margin-top:14px}
  .btns.two{grid-template-columns:1fr 1fr}

  /* nav */
  nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:532px;height:68px;background:var(--ink);border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:6;box-shadow:0 10px 28px rgba(0,0,0,.25)}
  nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#94a3b8;font-size:11px;font-weight:600;position:relative}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.on{color:#fff;font-weight:800}
  nav.tabs .plus{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
  nav.tabs .plus svg{width:26px;height:26px}
  .badge{position:absolute;top:-4px;right:calc(50% - 20px);background:var(--accent);color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:1px 6px}

  /* forms + sheet */
  label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:12px 2px 5px}
  input,select,textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:17px}
  textarea{min-height:76px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);border-color:transparent}
  .kpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpick button{border:2px solid transparent;border-radius:14px;padding:12px 4px;font-size:15px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;color:var(--muted)}
  .kpick button svg{width:24px;height:24px}
  .kpick button.on{color:#fff}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .seg button{border:2px solid transparent;background:#fff;border-radius:11px;padding:10px 2px;font-size:14px;font-weight:800;color:var(--muted)}
  .seg button.on.s-new{border-color:var(--blue)} .seg button.on.s-scheduled{border-color:var(--amber)} .seg button.on.s-done{border-color:var(--red)} .seg button.on.s-paid{border-color:var(--green)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .link-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .link-row a{background:#fff;border-radius:12px;padding:9px 13px;text-decoration:none;font-weight:700;font-size:15px;color:var(--navy)}
  .part{display:grid;grid-template-columns:1fr 110px 46px;gap:8px;margin-bottom:8px}
  .part button{border:0;background:#fff;border-radius:12px;font-size:20px;color:var(--red)}
  .inv-line{display:flex;justify-content:space-between;color:var(--muted);padding:3px 2px}
  .inv-total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;padding:14px 2px 2px;border-top:2px solid var(--ink);margin-top:12px}
  .sheet-h{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 2px 8px;font-weight:800}
  #sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(15,20,30,.45)}
  #sheet.open{display:block}
  #sheet .panel{position:absolute;left:0;right:0;bottom:0;top:28px;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
  #sheet .shead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  #sheet .shead h2{margin:0;flex:1;font-size:21px;font-weight:900}
  #sheet .close{border:0;background:#e2e8f0;border-radius:99px;width:40px;height:40px;font-size:18px}
  #sheet .body{overflow-y:auto;padding:6px 16px 40px;flex:1}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  #toast.on{opacity:1}
  .seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e2e8f0;border-radius:12px;padding:4px;margin-top:12px}
  .seg2 button{border:0;background:none;border-radius:9px;padding:10px;font-weight:800;font-size:15px;color:var(--muted)}
  .seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .grid3{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:8px}
  .grid3 input,.grid3 select{padding:12px 10px;font-size:16px}
  .item{background:#fff;border-radius:14px;padding:10px;margin-bottom:8px}
  .ihead{display:flex;align-items:center;gap:8px}
  .ihead input{border:0;padding:8px 4px;font-weight:700;flex:1;min-width:0}
  .itag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;border-radius:99px;white-space:nowrap}
  .irm{border:0;background:#f6f7f9;border-radius:10px;width:36px;height:36px;color:var(--red);font-size:16px;flex-shrink:0}
  .irow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:6px}
  .irow label{margin:0;font-size:12px}
  .irow input{padding:10px;font-size:16px;margin-top:3px}
  .ltot{font-weight:900;font-size:17px;padding:0 4px 10px;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
  .qadd{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .qchip{border:1.5px dashed #cbd5e1;background:#fff;border-radius:99px;padding:9px 13px;font-size:14px;font-weight:700;color:var(--ink)}
  .qchip b{color:var(--muted);font-weight:700}
  .paper-wrap{margin-top:14px;overflow-x:auto}
  .paper{background:#fff;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:0 18px 22px;font-size:12px;line-height:1.45;color:#0f172a;min-width:320px;position:relative;overflow:hidden}
  .pbar{height:6px;background:#d6203f;margin:0 -18px 16px}
  .phead{display:flex;justify-content:space-between;gap:12px}
  .pbiz{font-size:17px;font-weight:900}
  .pmut{color:#556070}
  .pright{text-align:right}
  .ptitle{font-size:20px;font-weight:900;color:#d6203f;letter-spacing:.02em}
  .pmeta{margin-left:auto;border-collapse:collapse;margin-top:4px}
  .pmeta td{padding:1px 0 1px 10px;color:#556070;white-space:nowrap}
  .phead>div:first-child{min-width:0}
  .pmeta td+td{color:#0f172a;font-weight:700}
  .pcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid #e2e8f0;margin-top:14px;padding-top:12px}
  .plab{font-size:10px;font-weight:800;color:#556070;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .pitems{width:100%;border-collapse:collapse;margin-top:14px}
  .pitems th{background:#0f172a;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:7px 6px;text-align:right}
  .pitems th:first-child{text-align:left;border-radius:4px 0 0 4px}
  .pitems th:last-child{border-radius:0 4px 4px 0}
  .pitems td{padding:7px 6px;text-align:right;border-bottom:1px solid #eef1f5;white-space:nowrap}
  .pitems td:first-child{text-align:left;white-space:normal}
  .pitems tr:nth-child(even) td{background:#f8fafc}
  .ptot{margin:12px 0 0 auto;max-width:220px}
  .ptot div{display:flex;justify-content:space-between;padding:2px 0}
  .ptot .big{font-weight:900;font-size:14px;border-top:1px solid #0f172a;margin-top:4px;padding-top:6px}
  .ptot .due{color:#fff;border-radius:6px;padding:8px 10px;margin-top:6px;font-weight:900;font-size:13px}
  .pnote{white-space:pre-wrap}
  .copybox{width:100%;min-height:240px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
</style>
</head>
<body>
<div id="banner"></div>
<div id="upd" role="status"><div class="mid"><b>New version ready</b><span id="updNote"></span></div><a id="updGo" href="#">Update</a><button id="updX" aria-label="Not now">✕</button></div>
<main id="view"><div class="empty">Loading…</div></main>
<nav class="tabs" id="tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-tab="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
  <span class="plus" id="newJob" role="button" tabindex="0" aria-label="New job"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
  <button data-tab="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Bills<span id="billBadge"></span></button>
  <button data-tab="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>All jobs</button>
</nav>
<div id="sheet"><div class="panel"><div class="shead"><h2 id="sheetTitle"></h2><button class="close" id="sheetClose" aria-label="Close">✕</button></div><div class="body" id="sheetBody"></div></div></div>
<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = () => new Date().toLocaleDateString("en-CA");
const money = n => "$" + (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => "$" + Math.round(Number(n)||0).toLocaleString("en-US");
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isNaN(n) ? 0 : n; };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function parseDay(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function fmtDay(s, long){ if(!s) return ""; return parseDay(s).toLocaleDateString("en-US", long ? {weekday:"long",month:"long",day:"numeric"} : {weekday:"short",month:"short",day:"numeric"}); }
function addDays(s, n){ const d = parseDay(s); d.setDate(d.getDate()+n); return d.toLocaleDateString("en-CA"); }
function fmtTime(t){ if(!t) return ""; const [h,m] = t.split(":").map(Number); const ap = h>=12?"pm":"am"; return ((h%12)||12) + (m?":"+String(m).padStart(2,"0"):"") + ap; }
function daysSince(s){ if(!s) return 0; return Math.max(0, Math.round((parseDay(todayStr()) - parseDay(s))/86400000)); }
function weekStart(){ const d = parseDay(todayStr()); d.setDate(d.getDate()-d.getDay()); return d.toLocaleDateString("en-CA"); }

const DEFAULT_SETTINGS = { business:"", phone:"", email:"", address:"", license:"", workers:[], rate:95, taxPct:0, nextInv:1001, terms:"receipt", invNote:"Thank you for your business!", quickItems:[] };
const Store = {
  mode:"loading", db:null, jobs:{}, settings:{...DEFAULT_SETTINGS}, writes:{},
  async init(){
    let db = null;
    try { if (window.claude && typeof window.claude.use === "function") db = await window.claude.use("db"); } catch(e){ db = null; }
    if (!db) { this.useLocal(); return; }
    this.db = db; this.mode = "online";
    let firstJobs = false;
    const timer = setTimeout(()=>{ if(!firstJobs) banner("Can't reach your saved jobs yet. Check your signal — it will catch up on its own."); }, 10000);
    db.collection("jobs").onSnapshot(snap => {
      const j = {}; snap.docs.forEach(d => { j[d.id] = {...d.data(), id:d.id}; });
      this.jobs = j;
      if (!snap.metadata.fromCache){ firstJobs = true; clearTimeout(timer); banner(""); }
      render();
    }, err => { clearTimeout(timer); banner("Lost connection to saved jobs. Close and reopen the app."); });
    db.doc("settings/main").onSnapshot(snap => {
      this.settings = {...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {})};
      render();
    }, ()=>{});
  },
  useLocal(){
    this.mode = "local";
    try { this.jobs = JSON.parse(localStorage.getItem("hvac.jobs")||"{}"); this.settings = {...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem("hvac.settings")||"{}")}; } catch(e){}
    seedDemo();
    render();
  },
  persistLocal(){ try{ localStorage.setItem("hvac.jobs", JSON.stringify(this.jobs)); localStorage.setItem("hvac.settings", JSON.stringify(this.settings)); }catch(e){} },
  queue(key, fn){ const prev = this.writes[key] || Promise.resolve(); const p = prev.then(fn).catch(e => { toast(e && e.code==="quota_exceeded" ? "Storage is full — couldn't save." : "Couldn't save. Try again."); }); this.writes[key]=p; return p; },
  saveJob(job){
    job = JSON.parse(JSON.stringify(job));
    this.jobs[job.id] = job; render();
    if (this.mode === "online") return this.queue("job:"+job.id, ()=> this.db.collection("jobs").doc(job.id).set(job));
    this.persistLocal(); return Promise.resolve();
  },
  deleteJob(id){
    delete this.jobs[id]; render();
    if (this.mode === "online") return this.queue("job:"+id, ()=> this.db.collection("jobs").doc(id).delete());
    this.persistLocal(); return Promise.resolve();
  },
  saveSettings(s){
    this.settings = {...this.settings, ...s}; render();
    const body = JSON.parse(JSON.stringify(this.settings));
    if (this.mode === "online") return this.queue("settings", ()=> this.db.doc("settings/main").set(body));
    this.persistLocal(); return Promise.resolve();
  }
};

/* ---------- money math ---------- */
const qtyOf = it => (it.qty === "" || it.qty == null) ? 1 : num(it.qty);
function getItems(j){
  if (Array.isArray(j.items)) return j.items;
  const s = Store.settings, items = [];
  if (num(j.hours) > 0) items.push({kind:"labor", desc:"Labor", qty:String(num(j.hours)), price:String(j.rate != null && j.rate !== "" ? num(j.rate) : num(s.rate))});
  (j.parts||[]).forEach(p => items.push({kind:"part", desc:p.name||"Part", qty:"1", price:String(p.price ?? "")}));
  return items;
}
function invoiceTotals(j){
  const items = getItems(j);
  const sub = items.reduce((a,it)=>a+qtyOf(it)*num(it.price),0);
  const discount = Math.min(num(j.discount), sub);
  const taxPct = (j.taxPct != null && j.taxPct !== "") ? num(j.taxPct) : num(Store.settings.taxPct);
  const tax = Math.round((sub - discount) * taxPct) / 100;
  const total = sub - discount + tax;
  const paidAmt = j.status === "paid" ? total : Math.min(num(j.deposit), total);
  return {items, sub, discount, taxPct, tax, total, paidAmt, due: Math.max(0, total - paidAmt)};
}
const paidFull = (j,t) => j.status === "paid" || (t.total > 0 && t.due === 0);
const hasInvoice = j => getItems(j).some(it => num(it.price) || (it.desc||"").trim());

/* ---------- state ---------- */
const UI = { tab:"today", filter:"open", q:"", day: todayStr() };
const jobsArr = () => Object.values(Store.jobs);
function sortJobs(a){
  return a.sort((x,y)=> (x.date||"9999").localeCompare(y.date||"9999") || (x.time||"99").localeCompare(y.time||"99") || (y.created||0)-(x.created||0));
}
function buckets(){
  const all = jobsArr(), today = todayStr();
  const todays = sortJobs(all.filter(j => j.date === today && (j.status==="new"||j.status==="scheduled")));
  const needBill = all.filter(j => j.status==="done" && !hasInvoice(j));
  const unpaid = all.filter(j => j.status==="done" && hasInvoice(j));
  const overdue = unpaid.filter(j => daysSince(j.doneOn) >= 14);
  const toBook = all.filter(j => j.status==="new" && !j.date);
  const owed = unpaid.reduce((a,j)=>a+invoiceTotals(j).due,0);
  const ws = weekStart();
  const billedWeek = all.filter(j => (j.status==="done"||j.status==="paid") && hasInvoice(j) && (j.doneOn||"") >= ws).reduce((a,j)=>a+invoiceTotals(j).total,0);
  const doneToday = all.filter(j => j.date === today && (j.status==="done"||j.status==="paid")).length;
  return {todays, needBill, unpaid, overdue, toBook, owed, billedWeek, doneToday};
}

function render(){
  if (Store.mode === "loading") return;
  document.querySelectorAll("#tabs button[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === UI.tab));
  const B = buckets();
  const billCount = B.needBill.length + B.unpaid.length;
  $("#billBadge").innerHTML = billCount ? `<span class="badge">${billCount}</span>` : "";

}

function routeSvg(stops, k){
  const P = [[46,84],[150,48],[236,62],[316,26]].slice(0, Math.max(1, Math.min(4, stops.length)));
  const K = KIND[k];
  let d = `M${P[0][0]} ${P[0][1]}`; for (let i=1;i<P.length;i++){ const [x0,y0]=P[i-1],[x1,y1]=P[i]; d += ` C ${x0+40} ${y0}, ${x1-40} ${y1}, ${x1} ${y1}`; }
  const pins = P.map(([x,y],i)=>{
    const kk = KIND[kindOf(stops[i]||{})];
    return i===0
      ? `<circle cx="${x}" cy="${y}" r="14" fill="#fff"/><text x="${x}" y="${y+5}" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="900" fill="${K.color}">1</text>`
      : `<circle cx="${x}" cy="${y}" r="13" fill="${kk.color}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="800" fill="#fff">${i+1}</text>`;
  }).join("");
  return `<svg viewBox="0 0 362 112" role="img" aria-label="Today's ${stops.length} stop${stops.length>1?"s":""}">
    <rect width="362" height="112" fill="${K.map}"/>
    <path d="M0 34 H362 M0 82 H362 M72 0 V112 M184 0 V112 M296 0 V112" stroke="${K.road}" stroke-width="10"/>
    <path d="M0 10 L118 112 M244 0 L362 62" stroke="${K.road}" stroke-width="5"/>
    ${P.length>1?`<path d="${d}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/>`:""}
    ${pins}</svg>`;
}

  const todo = [];
  if (B.needBill.length) todo.push({n:B.needBill.length, t:"Bills to make", s:B.needBill.map(j=>j.name).slice(0,3).join(", ")+" — finished", bg:"#ffe4e8", fg:"#b0172f", go:"bills"});
  if (B.toBook.length) todo.push({n:B.toBook.length, t:"Call to book", s:B.toBook.map(j=>j.name).slice(0,3).join(", "), bg:"#e3ecff", fg:"#1d4fc4", go:"schedule"});
  if (B.overdue.length) todo.push({n:B.overdue.length, t:"Overdue payment", s:B.overdue.map(j=>`${j.name} — ${daysSince(j.doneOn)} days`).slice(0,2).join(", "), bg:"#fff1d6", fg:"#8a5a00", go:"bills"});
  html += `<h2 class="sec" style="margin-top:${t.length>1?36:22}px">Needs you<span class="cnt">${todo.length?todo.length+" thing"+(todo.length>1?"s":""):""}</span></h2>`;
  html += todo.length ? `<div class="list">${todo.map(x=>`<button class="li" data-go="${x.go}"><span class="num" style="background:${x.bg};color:${x.fg}">${x.n}</span><span class="mid"><b>${x.t}</b><span>${esc(x.s)}</span></span>${CHEV}</button>`).join("")}</div>`
    : `<div class="list"><div class="li"><span class="num" style="background:#dcfce7;color:#15803d">✓</span><span class="mid"><b>All caught up</b><span>No bills or calls waiting.</span></span></div></div>`;
  html += `<div class="tiles"><button class="tile" data-go="bills"><small>Billed this week</small><b>${money0(B.billedWeek)}</b></button><button class="tile dark" data-go="bills"><small>Owed to you</small><b>${money0(B.owed)}</b></button></div>`;
  return html;
}

function stackCard(j, label){
  const k = kindOf(j);
  return `<button class="scard" style="background:${j.status==="done"?"#64748b":KIND[k].color}" data-open="${j.id}">
    <div class="kindrow"><span class="kindlab"><span class="kic">${ICON[k]}</span>${esc(label)}</span><span class="t">${j.time?fmtTime(j.time):""}</span></div>
    <div class="row"><span class="nm">${esc(j.name)}</span>${j.worker?`<span class="tag">${esc(j.worker)}</span>`:""}</div>
    ${j.problem?`<div class="p">${esc(j.problem)}</div>`:""}
    ${j.address?`<div class="a">${esc(j.address)}</div>`:""}
  </button>`;
}

function jobCard(j, extra){
  const k = kindOf(j);
  const when = extra || (j.date ? `${fmtDay(j.date)}${j.time?" · "+fmtTime(j.time):""}${j.worker?" · "+esc(j.worker):""}` : "Not booked yet");
  return `<button class="jcard" data-open="${j.id}">
    <span class="ktile" style="background:${KIND[k].color}">${ICON[k]}</span>
    <span class="mid"><span class="r1"><span class="nm">${esc(j.name||"(no name)")}</span><span class="pill s-${j.status}">${STATUS[j.status]}</span></span>
    ${j.problem?`<span class="p">${esc(j.problem)}</span>`:""}
    <span class="s">${esc(j.address||"")}</span><span class="s">${when}</span></span>
  </button>`;
}

function viewJobs(){
  const all = jobsArr();
  const cnt = {open: all.filter(j=>j.status==="new"||j.status==="scheduled").length, done: all.filter(j=>j.status==="done").length};
  const filters = {open:"Open"+(cnt.open?" · "+cnt.open:""), done:"Unpaid"+(cnt.done?" · "+cnt.done:""), paid:"Paid", all:"All"};
  let list = all;
  if (UI.filter === "open") list = list.filter(j => j.status==="new" || j.status==="scheduled");
  else if (UI.filter !== "all") list = list.filter(j => j.status === UI.filter);
  const q = UI.q.trim().toLowerCase();
  if (q) list = all.filter(j => [j.name,j.address,j.phone,j.problem].join(" ").toLowerCase().includes(q));
  sortJobs(list);
  if (!q && (UI.filter==="paid" || UI.filter==="all")) list.reverse();
  return `<h1 class="page">All jobs</h1>
    <input class="search" id="q" placeholder="Search name, address, phone…" value="${esc(UI.q)}" aria-label="Search jobs">
    ${q?`<p class="hint">${list.length} match${list.length===1?"":"es"} for "${esc(UI.q)}"</p>`:`<div class="chips">${Object.entries(filters).map(([k,l])=>`<button class="chip ${UI.filter===k?"on":""}" data-filter="${k}">${l}</button>`).join("")}</div>`}
    ${list.length ? list.map(j=>jobCard(j)).join("") : `<div class="empty">${all.length ? "No jobs here." : "No jobs yet.<br>Tap <b>+</b> when a customer calls."}</div>`}`;
}

function viewSchedule(B){
  const day = UI.day, s = Store.settings;
  const dayJobs = sortJobs(jobsArr().filter(j => j.date === day && j.status !== "paid"));
  const workers = [...s.workers]; dayJobs.forEach(j => { if (j.worker && !workers.includes(j.worker)) workers.push(j.worker); });
  const groups = workers.map(w => ({w, jobs: dayJobs.filter(j => j.worker === w)})).filter(g => g.jobs.length);
  const unassigned = dayJobs.filter(j => !j.worker);
  const isToday = day === todayStr();
  const lab = j => j.status==="done" ? "Done" : KIND[kindOf(j)].label;
  return `<h1 class="page">Schedule</h1>
    <div class="datebar"><button class="arrow" data-day="-1" aria-label="Previous day">‹</button>
      <div class="mid"><div class="big">${isToday?"Today":fmtDay(day)}</div><div class="sm">${fmtDay(day,true)}</div></div>
      <button class="arrow" data-day="1" aria-label="Next day">›</button></div>
    ${!isToday?`<button class="btn ghost small" data-day="today" style="margin:4px 0">Back to today</button>`:""}
    ${!s.workers.length?`<div class="card hint" style="margin-top:10px">Add your workers' names in Settings (gear, top of Today) so you can assign jobs.</div>`:""}
    ${groups.map(g=>`<div class="whead"><b>${esc(g.w)} <span class="muted" style="font-weight:500">· ${g.jobs.length} job${g.jobs.length>1?"s":""}</span></b><button class="btn accent small" data-text="${esc(g.w)}">Text ${esc(g.w)}</button></div><div class="stack">${g.jobs.map(j=>stackCard(j, lab(j))).join("")}</div>`).join("")}
    ${unassigned.length?`<div class="whead"><b>No worker yet</b></div><div class="stack">${unassigned.map(j=>stackCard(j, lab(j))).join("")}</div>`:""}
    ${!dayJobs.length?`<div class="empty">Nothing booked for this day.</div>`:""}
    ${B.toBook.length?`<h2 class="sec">Waiting for a day<span class="cnt">${B.toBook.length}</span></h2>${sortJobs(B.toBook).map(j=>jobCard(j,"Tap to pick a day")).join("")}`:""}`;
}

function viewBills(B){
  const paid = jobsArr().filter(j => j.status==="paid").sort((a,b)=>(b.paidOn||"").localeCompare(a.paidOn||"")).slice(0,15);
  const unpaid = [...B.unpaid].sort((a,b)=>(a.doneOn||"").localeCompare(b.doneOn||""));
  return `<h1 class="page">Bills</h1>
    <div class="owed"><small>Owed to you</small><div class="amt">${money(B.owed)}</div><small>${unpaid.length} unpaid bill${unpaid.length===1?"":"s"} · ${money0(B.billedWeek)} billed this week</small></div>
    ${B.needBill.length?`<h2 class="sec">Make a bill<span class="cnt">${B.needBill.length}</span></h2><div class="list">${B.needBill.map(j=>`<button class="li" data-open="${j.id}" data-mode="invoice"><span class="num" style="background:${KIND[kindOf(j)].color};color:#fff">${ICON[kindOf(j)].replace("<svg","<svg width=\"22\" height=\"22\"")}</span><span class="mid"><b>${esc(j.name)}</b><span>${esc(j.problem||"")} · finished ${j.doneOn?fmtDay(j.doneOn):""}</span></span>${CHEV}</button>`).join("")}</div>`:""}
    <h2 class="sec">Waiting for payment<span class="cnt">${unpaid.length||""}</span></h2>
    ${unpaid.length ? unpaid.map(j=>{ const d=daysSince(j.doneOn); return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:18px">${esc(j.name)}</b><span class="money" style="font-size:18px">${money(invoiceTotals(j).due)}</span></div>
      <div class="hint" style="margin:2px 0 0">${j.invNo?"Bill #"+j.invNo+" · ":""}${d===0?"Done today":d+" day"+(d>1?"s":"")+" waiting"}${d>=14?' · <b style="color:#b0172f">overdue</b>':""}</div>
      <div class="btns two" style="margin-top:10px"><button class="btn ghost small" data-open="${j.id}" data-mode="invoice">View bill</button><button class="btn green small" data-paid="${j.id}">Mark paid</button></div></div>`;}).join("")
      : `<div class="empty">Nobody owes anything right now.</div>`}
    ${paid.length?`<h2 class="sec">Paid</h2><div class="list">${paid.map(j=>`<button class="li" data-open="${j.id}" data-mode="invoice"><span class="mid"><b>${esc(j.name)}</b><span>${j.invNo?"#"+j.invNo+" · ":""}paid ${j.paidOn?fmtDay(j.paidOn):""}</span></span><span class="money">${money(invoiceTotals(j).total)}</span></button>`).join("")}</div>`:""}`;
}

/* ---------- sheet (pop-up screens) ---------- */
function openSheet(title, html){ $("#sheetTitle").textContent = title; $("#sheetBody").innerHTML = html; $("#sheet").classList.add("open"); $("#sheetBody").scrollTop = 0; }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#sheetBody").innerHTML = ""; }

function workerOptions(sel){
  const ws = [...Store.settings.workers]; if (sel && !ws.includes(sel)) ws.push(sel);
  return `<option value="">— Nobody yet —</option>` + ws.map(w=>`<option ${w===sel?"selected":""}>${esc(w)}</option>`).join("");
}

function openJob(id){
  const j = id ? {...Store.jobs[id]} : {id:newId(), created:Date.now(), status:"new", kind:defaultKind(), name:"", phone:"", address:"", problem:"", date:"", time:"", worker:"", notes:"", parts:[], hours:""};
  if (!j || !j.id) return;
  const isNew = !id;
  const tel = telOf(j.phone);
  let kind = kindOf(j);
  openSheet(isNew ? "New job" : (j.name || "Job"), `
    <form id="jobForm" autocomplete="off">
      <label>Type of job</label>
      <div class="kpick" id="kpick">${Object.entries(KIND).map(([k,K])=>`<button type="button" data-k="${k}" class="${kind===k?"on":""}" style="${kind===k?`background:${K.color}`:""}">${ICON[k]}${K.label}</button>`).join("")}</div>
      ${!isNew?`<label>Status</label><div class="seg" id="seg">${Object.entries(STATUS).map(([k,l])=>`<button type="button" class="s-${k} ${j.status===k?"on":""}" data-st="${k}">${l}</button>`).join("")}</div>`:""}
      <label for="f-name">Customer name</label><input id="f-name" name="name" value="${esc(j.name)}" required>
      <label for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" inputmode="tel" value="${esc(j.phone)}">
      <label for="f-addr">Address</label><input id="f-addr" name="address" value="${esc(j.address)}">
      ${!isNew && (j.phone||j.address)?`<div class="link-row">${tel?`<a href="tel:${esc(tel)}">Call ${esc(j.phone)}</a><a href="sms:${esc(tel)}">Text</a>`:""}${j.address?`<a href="${mapUrl(j.address)}" target="_blank" rel="noopener">Directions</a>`:""}</div>`:""}
      <label for="f-prob">What's wrong / what to do</label><textarea id="f-prob" name="problem" placeholder="No heat, furnace clicking…">${esc(j.problem)}</textarea>
      <div class="sheet-h">When &amp; who</div>
      <div class="grid2"><div><label for="f-date" style="margin-top:0">Day</label><input id="f-date" name="date" type="date" value="${esc(j.date)}"></div><div><label for="f-time" style="margin-top:0">Time</label><input id="f-time" name="time" type="time" value="${esc(j.time)}"></div></div>
      <label for="f-worker">Worker</label><select id="f-worker" name="worker">${workerOptions(j.worker)}</select>
      <label for="f-notes">Notes (only you see these)</label><textarea id="f-notes" name="notes" placeholder="Gate code, dog, equipment model…">${esc(j.notes)}</textarea>
      <div class="btns">
        <button class="btn accent" type="submit">${isNew?"Save job":"Save changes"}</button>
        ${!isNew && (j.status==="done"||j.status==="paid")?`<button class="btn ghost" type="button" id="toInv">Open bill</button>`:""}
        ${!isNew && j.status!=="done" && j.status!=="paid"?`<button class="btn green" type="button" id="markDone">Job is done — make bill</button>`:""}
        ${!isNew?`<button class="btn danger" type="button" id="delJob">Delete job</button>`:""}
      </div>
    </form>`);
  let status = j.status;
  $("#kpick").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if(!b) return; kind = b.dataset.k;
    $("#kpick").querySelectorAll("button").forEach(x => { const on = x===b; x.classList.toggle("on", on); x.style.background = on ? KIND[x.dataset.k].color : ""; }); });
  const seg = $("#seg");
  if (seg) seg.addEventListener("click", e => { const b = e.target.closest("[data-st]"); if(!b) return; status = b.dataset.st; seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b)); });
  const collect = () => {
    const f = new FormData($("#jobForm")); const out = {...j, kind};
    ["name","phone","address","problem","date","time","worker","notes"].forEach(k => out[k] = (f.get(k)||"").toString().trim());
    out.status = status;
    if (out.status === "new" && out.date) out.status = "scheduled";
    if (out.status === "done" && !out.doneOn) out.doneOn = todayStr();
    if (out.status === "paid" && !out.paidOn) out.paidOn = todayStr();
    if (out.status !== "paid") out.paidOn = "";
    return out;
  };
  $("#jobForm").addEventListener("submit", e => { e.preventDefault(); const out = collect(); if(!out.name){ toast("Add a customer name"); return; } Store.saveJob(out); closeSheet(); toast(isNew ? "Job saved" : "Saved"); });
  const md = $("#markDone"); if (md) md.onclick = () => { status = "done"; const out = collect(); Store.saveJob(out); openInvoice(out.id); };
  const ti = $("#toInv"); if (ti) ti.onclick = () => { const out = collect(); Store.saveJob(out); openInvoice(out.id); };
  const dj = $("#delJob"); if (dj) dj.onclick = () => askConfirm(`Delete the job for ${j.name||"this customer"}? This can't be undone.`, "Delete", () => { Store.deleteJob(j.id); closeSheet(); toast("Job deleted"); });
}

function markDone(id){
  const j = {...Store.jobs[id]}; if (!j.id) return;
  j.status = "done"; if (!j.doneOn) j.doneOn = todayStr();
  Store.saveJob(j); openInvoice(id);
}

/* ---------- invoice builder ---------- */
const TERMS = {receipt:"Due on receipt", net15:"Net 15 days", net30:"Net 30 days"};
const ITEM_KIND = {labor:{label:"Labor", bg:"#e3ecff", fg:"#1d4fc4"}, part:{label:"Part", bg:"#fbe6d6", fg:"#8a3a0d"}, service:{label:"Service", bg:"#dcfce7", fg:"#15803d"}, other:{label:"Other", bg:"#eef1f5", fg:"#475569"}};
const longDate = s => s ? parseDay(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";
const fmtQty = q => Number.isInteger(q) ? String(q) : String(+q.toFixed(2));
function dueLabel(j){
  const d = j.invDate || todayStr();
  if (j.terms === "net15") return longDate(addDays(d,15));
  if (j.terms === "net30") return longDate(addDays(d,30));
  return "On receipt";
}

function openInvoice(id){
  const j0 = Store.jobs[id]; if (!j0) return;
  const s = Store.settings;
  const j = JSON.parse(JSON.stringify(j0));
  j.items = JSON.parse(JSON.stringify(getItems(j0)));
  if (!j.invDate) j.invDate = j.doneOn || todayStr();
  if (!j.terms) j.terms = s.terms || "receipt";
  if (j.invNote == null) j.invNote = s.invNote || "";
  let mode = "edit";

  const itemRow = (it,i) => { const K = ITEM_KIND[it.kind] || ITEM_KIND.other; return `<div class="item">
      <div class="ihead"><span class="itag" style="background:${K.bg};color:${K.fg}">${K.label}</span><input data-i="${i}" data-f="desc" value="${esc(it.desc)}" placeholder="What was done / part name" aria-label="Item description"><button type="button" class="irm" data-rm="${i}" aria-label="Remove item">✕</button></div>
      <div class="irow"><label>${it.kind==="labor"?"Hours":"Qty"}<input data-i="${i}" data-f="qty" inputmode="decimal" value="${esc(it.qty)}" placeholder="1"></label><label>${it.kind==="labor"?"Rate":"Price"}<input data-i="${i}" data-f="price" inputmode="decimal" value="${esc(it.price)}" placeholder="$0"></label><span class="ltot" id="lt${i}">${money(qtyOf(it)*num(it.price))}</span></div>
    </div>`; };

  const draw = () => {
    const title = `Bill${j.invNo?" #"+j.invNo:""} · ${j.name||""}`;
    const tabs = `<div class="seg2"><button type="button" data-view="edit" class="${mode==="edit"?"on":""}">Edit</button><button type="button" data-view="preview" class="${mode==="preview"?"on":""}">Preview</button></div>`;
    const actions = `<div class="btns">
        <button class="btn accent" type="button" id="invSend">${isNativeApp()?"Send as PDF":"Download PDF"}</button>
        <div class="btns two" style="margin-top:0"><button class="btn ghost" type="button" id="invCopy">Copy as text</button>${j.status!=="paid"?`<button class="btn green" type="button" id="invPaid">Mark paid</button>`:`<button class="btn ghost" type="button" id="invUnpaid">Not paid</button>`}</div>
        <div class="btns two" style="margin-top:0"><button class="btn ghost" type="button" id="invSave">Save</button><button class="btn ghost" type="button" id="invJob">Job details</button></div>
      </div>`;
    if (mode === "preview"){
      openSheet(title, tabs + `<div class="paper-wrap">${invoiceHTML(j)}</div>` + actions);
    } else {
      const quick = (s.quickItems||[]).map((q,i)=>`<button type="button" class="qchip" data-quick="${i}">+ ${esc(q.desc)} <b>${money0(q.price)}</b></button>`).join("");
      openSheet(title, tabs + `
        <div class="sheet-h">Bill to</div>
        <input id="i-name" value="${esc(j.name)}" placeholder="Customer name" aria-label="Customer name">
        <input id="i-addr" value="${esc(j.address)}" placeholder="Address" aria-label="Address" style="margin-top:8px">
        <div class="grid2" style="margin-top:8px"><input id="i-phone" type="tel" value="${esc(j.phone)}" placeholder="Phone" aria-label="Phone"><input id="i-email" type="email" value="${esc(j.email||"")}" placeholder="Email" aria-label="Email"></div>
        <div class="sheet-h">Bill details</div>
        <div class="grid3"><div><label for="i-no" style="margin-top:0">Bill #</label><input id="i-no" inputmode="numeric" value="${esc(j.invNo||"")}" placeholder="${esc(s.nextInv)}"></div><div><label for="i-date" style="margin-top:0">Date</label><input id="i-date" type="date" value="${esc(j.invDate)}"></div><div><label for="i-terms" style="margin-top:0">Due</label><select id="i-terms">${Object.entries(TERMS).map(([k,l])=>`<option value="${k}" ${j.terms===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
        <div class="sheet-h">Items</div>
        <div id="items">${j.items.length ? j.items.map(itemRow).join("") : `<div class="hint" style="margin:0 0 8px">No items yet — add labor, parts or a quick item below.</div>`}</div>
        <div class="qadd">
          <button type="button" class="qchip" data-add="labor">+ Labor</button>
          <button type="button" class="qchip" data-add="part">+ Part</button>
          ${quick}
          <button type="button" class="qchip" data-add="other">+ Other</button>
        </div>
        ${!(s.quickItems||[]).length?`<p class="hint">Tip: add your usual prices (service call, tune-up…) in Settings and they show up here as one-tap buttons.</p>`:""}
        <div class="sheet-h">Adjustments</div>
        <div class="grid3"><div><label for="i-disc" style="margin-top:0">Discount $</label><input id="i-disc" inputmode="decimal" value="${esc(j.discount||"")}" placeholder="0"></div><div><label for="i-tax" style="margin-top:0">Tax %</label><input id="i-tax" inputmode="decimal" value="${esc(j.taxPct ?? "")}" placeholder="${esc(s.taxPct||0)}"></div><div><label for="i-dep" style="margin-top:0">Paid already</label><input id="i-dep" inputmode="decimal" value="${esc(j.deposit||"")}" placeholder="$0"></div></div>
        <label for="i-note">Note on the bill</label><textarea id="i-note" placeholder="Warranty, thank you, how to pay…">${esc(j.invNote)}</textarea>
        <div class="card" style="margin-top:14px" id="totals"></div>` + actions);
      drawTotals();
      const body = $("#sheetBody");
      body.querySelectorAll("#items input").forEach(el => el.addEventListener("input", () => {
        const i = +el.dataset.i; j.items[i][el.dataset.f] = el.value;
        const lt = $("#lt"+i); if (lt) lt.textContent = money(qtyOf(j.items[i])*num(j.items[i].price));
        drawTotals();
      }));
      const bindVal = (sel, fn) => { const el = $(sel); if (el) el.addEventListener("input", () => { fn(el.value); drawTotals(); }); };
      bindVal("#i-name", v => j.name = v); bindVal("#i-addr", v => j.address = v); bindVal("#i-phone", v => j.phone = v); bindVal("#i-email", v => j.email = v);
      bindVal("#i-no", v => j.invNo = v.trim() ? Math.round(num(v)) : ""); bindVal("#i-date", v => j.invDate = v || todayStr());
      $("#i-terms").addEventListener("change", e => { j.terms = e.target.value; });
      bindVal("#i-disc", v => j.discount = v); bindVal("#i-tax", v => j.taxPct = v === "" ? null : v); bindVal("#i-dep", v => j.deposit = v); bindVal("#i-note", v => j.invNote = v);
    }
    bindCommon();
  };
  const drawTotals = () => {
    const el = $("#totals"); if (!el) return;
    const t = invoiceTotals(j);
    el.innerHTML = `<div class="inv-line"><span>Subtotal</span><span>${money(t.sub)}</span></div>
      ${t.discount?`<div class="inv-line"><span>Discount</span><span>−${money(t.discount)}</span></div>`:""}
      ${t.taxPct?`<div class="inv-line"><span>Tax ${t.taxPct}%</span><span>${money(t.tax)}</span></div>`:""}
      <div class="inv-total"><span>Total</span><span>${money(t.total)}</span></div>
      ${t.paidAmt?`<div class="inv-line" style="color:#15803d"><span>Paid</span><span>−${money(t.paidAmt)}</span></div><div class="inv-line" style="color:var(--ink);font-weight:800"><span>Balance due</span><span>${money(t.due)}</span></div>`:""}`;
  };
  const bindCommon = () => {
    const body = $("#sheetBody");
    body.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { mode = b.dataset.view; draw(); });
    body.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { j.items.splice(+b.dataset.rm,1); draw(); });
    body.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
      const k = b.dataset.add;
      j.items.push(k==="labor" ? {kind:"labor", desc:"Labor", qty:"1", price:String(num(s.rate))} : {kind:k, desc:"", qty:"1", price:""});
      draw(); focusLast(k==="labor" ? "qty" : "desc");
    });
    body.querySelectorAll("[data-quick]").forEach(b => b.onclick = () => {
      const q = (s.quickItems||[])[+b.dataset.quick]; if (!q) return;
      j.items.push({kind:"service", desc:q.desc, qty:"1", price:String(q.price)}); draw(); toast(`Added ${q.desc}`);
    });
    $("#invSave").onclick = () => { save(); toast("Bill saved"); };
    $("#invCopy").onclick = () => { save(); showCopy("Bill text", invoiceText(j)); };
    $("#invSend").onclick = () => { save(); sendPdf(j); };
    const p = $("#invPaid"); if (p) p.onclick = () => { j.status="paid"; j.paidOn=todayStr(); save(); closeSheet(); toast("Marked paid"); };
    const u = $("#invUnpaid"); if (u) u.onclick = () => { j.status="done"; j.paidOn=""; save(); draw(); };
    $("#invJob").onclick = () => { save(); openJob(j.id); };
  };
  const focusLast = f => { const ins = document.querySelectorAll(`#items input[data-f="${f}"]`); const el = ins[ins.length-1]; if (el){ el.focus(); el.select && el.select(); } };
  const save = () => {
    j.items = j.items.filter(it => (it.desc||"").trim() || num(it.price));
    delete j.parts; delete j.hours; delete j.rate;
    if (!j.invNo){ j.invNo = num(Store.settings.nextInv) || 1001; }
    if (num(j.invNo) >= num(Store.settings.nextInv)) Store.saveSettings({nextInv: num(j.invNo) + 1});
    if (j.status === "new" || j.status === "scheduled") j.status = "done";
    if (j.status === "done" && !j.doneOn) j.doneOn = todayStr();
    Store.saveJob(j);
    $("#sheetTitle").textContent = `Bill #${j.invNo} · ${j.name||""}`;
    const no = $("#i-no"); if (no && !no.value) no.value = j.invNo;
  };
  draw();
}

function makePdf(j){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const s = Store.settings, t = invoiceTotals(j), W = 612, M = 44;
  const ink=[15,23,42], mut=[85,96,112], acc=[214,32,63], grn=[21,128,61];
  const C = c => doc.setTextColor(c[0],c[1],c[2]);
  const F = (w,sz) => { doc.setFont("helvetica", w); doc.setFontSize(sz); };
  const clean = v => String(v ?? "").replace(/[\u2014\u2013]/g,"-").replace(/\u2212/g,"-");
  let y = 60;
  doc.setFillColor(acc[0],acc[1],acc[2]); doc.rect(0,0,W,8,"F");
  F("bold",20); C(ink); doc.text(clean(s.business||"Invoice"), M, y);
  F("normal",10); C(mut);
  let hy = y+17; [s.address, [s.phone,s.email].filter(Boolean).join("   |   "), s.license?"License # "+s.license:""].filter(Boolean).forEach(l => { doc.text(clean(l), M, hy); hy += 13; });
  F("bold",26); C(acc); doc.text("INVOICE", W-M, y, {align:"right"});
  let my = y+20;
  [["Invoice #", j.invNo||""],["Date", longDate(j.invDate)],["Due", dueLabel(j)]].forEach(([k,v]) => { F("normal",10); C(mut); doc.text(k, W-M-120, my); F("bold",10); C(ink); doc.text(clean(v), W-M, my, {align:"right"}); my += 14; });
  y = Math.max(hy, my) + 14;
  doc.setDrawColor(226,232,240); doc.setLineWidth(1); doc.line(M,y,W-M,y); y += 24;
  F("bold",9); C(mut); doc.text("BILL TO", M, y); doc.text("JOB", W/2+10, y); y += 15;
  F("bold",11); C(ink); doc.text(clean(j.name), M, y);
  F("normal",10);
  let by = y+14; [j.address, j.phone, j.email].filter(Boolean).forEach(l => { doc.text(clean(l), M, by); by += 13; });
  let jy = y; F("bold",11); doc.text(clean(KIND[kindOf(j)].label + (j.doneOn ? " - " + longDate(j.doneOn) : "")), W/2+10, jy); jy += 14;
  F("normal",10);
  if (j.problem) doc.splitTextToSize(clean(j.problem), W/2-M-10).forEach(l => { doc.text(l, W/2+10, jy); jy += 13; });
  if (j.worker){ C(mut); doc.text("Technician: "+clean(j.worker), W/2+10, jy); jy += 13; C(ink); }
  y = Math.max(by, jy) + 18;
  const cx = {desc:M+12, qty:W-M-200, price:W-M-105, amt:W-M-12};
  const header = () => { doc.setFillColor(ink[0],ink[1],ink[2]); doc.roundedRect(M,y,W-2*M,26,4,4,"F"); F("bold",9); doc.setTextColor(255,255,255);
    doc.text("DESCRIPTION",cx.desc,y+17); doc.text("QTY",cx.qty,y+17,{align:"right"}); doc.text("PRICE",cx.price,y+17,{align:"right"}); doc.text("AMOUNT",cx.amt,y+17,{align:"right"}); y += 26; };
  header();
  t.items.forEach((it,i) => {
    F("normal",10);
    const lines = doc.splitTextToSize(clean(it.desc||""), cx.qty-cx.desc-50);
    const h = Math.max(1, lines.length)*13 + 13;
    if (y + h > 690){ doc.addPage(); y = 60; header(); F("normal",10); }
    if (i % 2 === 1){ doc.setFillColor(248,250,252); doc.rect(M,y,W-2*M,h,"F"); }
    C(ink); lines.forEach((l,k) => doc.text(l, cx.desc, y+17+k*13));
    const q = qtyOf(it);
    doc.text(fmtQty(q), cx.qty, y+17, {align:"right"}); doc.text(money(it.price), cx.price, y+17, {align:"right"}); doc.text(money(q*num(it.price)), cx.amt, y+17, {align:"right"});
    y += h;
  });
  doc.setDrawColor(226,232,240); doc.line(M,y,W-M,y); y += 22;
  if (y > 620){ doc.addPage(); y = 60; }
  const totTop = y;
  const row = (k,v,bold,col) => { F(bold?"bold":"normal", bold?12:10); C(col||ink); doc.text(k, W-M-180, y); doc.text(v, W-M-12, y, {align:"right"}); y += bold?20:16; };
  row("Subtotal", money(t.sub));
  if (t.discount) row("Discount", "-"+money(t.discount));
  if (t.taxPct) row(`Tax (${t.taxPct}%)`, money(t.tax));
  row("Total", money(t.total), true);
  if (t.paidAmt) row("Paid", "-"+money(t.paidAmt), false, grn);
  const bc = paidFull(j,t) ? grn : acc;
  doc.setFillColor(bc[0],bc[1],bc[2]); doc.roundedRect(W-M-196, y-6, 196, 34, 6, 6, "F");
  F("bold",12); doc.setTextColor(255,255,255); doc.text(paidFull(j,t) ? "Paid in full" : "Balance due", W-M-182, y+15); doc.text(money(t.due), W-M-12, y+15, {align:"right"});
  if (j.status === "paid"){ F("bold",38); C(grn); doc.text("PAID", M+30, totTop+50, {angle:12}); if (j.paidOn){ F("normal",10); doc.text("on "+longDate(j.paidOn), M+38, totTop+70, {angle:12}); } }
  let ny = y + 64;
  if (j.invNote){
    F("bold",9); C(mut); doc.text("NOTES", M, ny); ny += 15; F("normal",10); C(ink);
    doc.splitTextToSize(clean(j.invNote), W-2*M).forEach(l => { if (ny > 740){ doc.addPage(); ny = 60; } doc.text(l, M, ny); ny += 13; });
  }
  const pages = doc.getNumberOfPages();
  for (let pg = 1; pg <= pages; pg++){ doc.setPage(pg); F("normal",9); C(mut); doc.text(clean(`${s.business||""}${s.phone?"   |   "+s.phone:""}${pages>1?`   |   Page ${pg} of ${pages}`:""}`), W/2, 768, {align:"center"}); }
  return doc;
}

async function sendPdf(j){
  if (!window.jspdf){ toast("PDF maker didn't load — try again"); return; }
  const s = Store.settings, t = invoiceTotals(j);
  const safe = String(j.name||"customer").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"") || "customer";
  const file = `Invoice-${j.invNo}-${safe}.pdf`;
  let doc;
  try { doc = makePdf(j); } catch(e){ toast("Couldn't make the PDF"); return; }
  const P = window.Capacitor && window.Capacitor.Plugins;
  if (isNativeApp() && P && P.Filesystem && P.Share){
    try {
      const data = doc.output("datauristring").split(",")[1];
      const res = await P.Filesystem.writeFile({path:file, data, directory:"CACHE"});
      await P.Share.share({title:`Invoice #${j.invNo}`, text:`Invoice #${j.invNo} from ${s.business||"us"} — ${money(t.due||t.total)}${t.due?" due "+dueLabel(j).toLowerCase():""}. Thank you!`, url:res.uri, dialogTitle:"Send invoice"});
    } catch(e){ if (!/cancel/i.test(String(e && (e.message||e)))) toast("Couldn't open sharing — try Copy as text"); }
    return;
  }
  try { doc.save(file); toast("PDF downloaded"); } catch(e){ toast("Couldn't download — try Copy as text"); }
}

function invoiceText(j){
  const s = Store.settings, t = invoiceTotals(j);
  const L = [];
  L.push(`INVOICE #${j.invNo}${s.business?" — "+s.business:""}`);
  L.push(`Date: ${longDate(j.invDate||todayStr())}   Due: ${dueLabel(j)}`);
  L.push("");
  L.push(`Bill to: ${j.name}`); if (j.address) L.push(j.address);
  if (j.problem){ L.push(""); L.push(`Work: ${j.problem}`); }
  L.push("");
  t.items.forEach(it => { const q = qtyOf(it); L.push(`• ${it.desc||"Item"}${q!==1?` (${fmtQty(q)} × ${money(it.price)})`:""} — ${money(q*num(it.price))}`); });
  L.push("");
  L.push(`Subtotal: ${money(t.sub)}`);
  if (t.discount) L.push(`Discount: −${money(t.discount)}`);
  if (t.taxPct) L.push(`Tax (${t.taxPct}%): ${money(t.tax)}`);
  L.push(`TOTAL: ${money(t.total)}`);
  if (t.paidAmt) L.push(`Paid: −${money(t.paidAmt)}`);
  L.push(t.due ? `BALANCE DUE: ${money(t.due)}` : `PAID IN FULL — thank you!`);
  if (j.invNote){ L.push(""); L.push(j.invNote); }
  const contact = [s.business, s.phone, s.email].filter(Boolean).join(" · "); if (contact){ L.push(""); L.push(contact); }
  return L.join("\n");
}

function workerText(w, day){
  const list = sortJobs(jobsArr().filter(j => j.date === day && j.worker === w && (j.status==="new"||j.status==="scheduled")));
  const L = [`${w} — your jobs for ${fmtDay(day,true)}:`, ""];
  list.forEach((j,i) => {
    L.push(`${i+1}. ${j.time?fmtTime(j.time)+" — ":""}${j.name} (${KIND[kindOf(j)].label})`);
    if (j.address) L.push(`   ${j.address}`);
    if (j.problem) L.push(`   ${j.problem}`);
    if (j.phone) L.push(`   Customer: ${j.phone}`);
    L.push("");
  });
  L.push("Text me when each one is done.");
  return L.join("\n");
}

function showCopy(title, text){
  openSheet(title, `<p class="hint">Tap Copy, then paste it into a text or email.</p>
    <textarea class="copybox" id="copyText" aria-label="Text to copy">${esc(text)}</textarea>
    <div class="btns"><button class="btn accent" id="doCopy">Copy</button><button class="btn ghost" id="copyDone">Done</button></div>`);
  $("#doCopy").onclick = async () => {
    const txt = $("#copyText").value;
    try { await navigator.clipboard.writeText(txt); toast("Copied — now paste it in a text"); }
    catch(e){ const ta=$("#copyText"); ta.focus(); ta.select(); toast("Press and hold the text, then Copy"); }
  };
  $("#copyDone").onclick = closeSheet;
}

function askConfirm(msg, yes, fn){
  openSheet("Are you sure?", `<p style="font-size:18px">${esc(msg)}</p><div class="btns two"><button class="btn ghost" id="cNo">Cancel</button><button class="btn" style="background:var(--red)" id="cYes">${esc(yes)}</button></div>`);
  $("#cNo").onclick = closeSheet; $("#cYes").onclick = fn;
}

      <label for="s-quick">Quick prices — one per line, like: Service call | 89</label><textarea id="s-quick" name="quickItems" placeholder="Service call | 89&#10;Furnace tune-up | 129">${esc((s.quickItems||[]).map(q=>`${q.desc} | ${q.price}`).join("\n"))}</textarea>
      <label for="s-note">Note printed on every bill</label><textarea id="s-note" name="invNote">${esc(s.invNote ?? "")}</textarea>
      <div class="btns"><button class="btn accent" type="submit">Save settings</button></div>

      <p class="hint">${Store.mode==="online"?"Jobs are saved online, so they're safe if the phone is lost.":"Jobs are saved on this phone only (test version)."}</p>
      ${demoCount()?`<div class="btns"><button class="btn danger" type="button" id="clearDemo">Remove the ${demoCount()} demo jobs</button></div><p class="hint">Removes only the sample jobs. Anything you added stays.</p>`:""}
    </form>`);
  const cd = $("#clearDemo");
  if (cd) cd.onclick = () => askConfirm(`Remove all ${demoCount()} demo jobs? Jobs you added yourself stay.`, "Remove", async () => {
    closeSheet();
    for (const j of jobsArr().filter(j => j.demo)) await Store.deleteJob(j.id);
    toast("Demo jobs removed");
  });
  $("#setForm").addEventListener("submit", e => {
    e.preventDefault(); const f = new FormData(e.target);
    Store.saveSettings({
      business: f.get("business").trim(), phone: f.get("phone").trim(), email: f.get("email").trim(),
      address: f.get("address").trim(), license: f.get("license").trim(), terms: f.get("terms"), invNote: f.get("invNote"),
      quickItems: f.get("quickItems").split("\n").map(l => { const m = l.split("|"); return {desc:(m[0]||"").trim(), price:num(m[1]||"")}; }).filter(q => q.desc),
      workers: f.get("workers").split("\n").map(x=>x.trim()).filter(Boolean),
      rate: num(f.get("rate")), taxPct: num(f.get("taxPct")), nextInv: Math.max(1, Math.round(num(f.get("nextInv"))) || 1001)
    });
    closeSheet(); toast("Settings saved");
  });

/* ---------- events ---------- */
function goTab(t){ UI.tab = t; render(); window.scrollTo(0,0); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(b) goTab(b.dataset.tab); });
$("#newJob").onclick = () => openJob(null);
$("#newJob").onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); openJob(null); } };
$("#sheetClose").onclick = closeSheet;
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
$("#view").addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  const o = e.target.closest("[data-open]");
  const dn = e.target.closest("[data-done]");
  const f = e.target.closest("[data-filter]");
  const d = e.target.closest("[data-day]");
  const t = e.target.closest("[data-text]");
  const p = e.target.closest("[data-paid]");
  if (dn){ markDone(dn.dataset.done); return; }
  if (t){ showCopy(`Text for ${t.dataset.text}`, workerText(t.dataset.text, UI.day)); return; }
  if (p){ const j = {...Store.jobs[p.dataset.paid], status:"paid", paidOn: todayStr()}; Store.saveJob(j); toast(`${j.name} marked paid`); return; }
  if (o){ o.dataset.mode === "invoice" ? openInvoice(o.dataset.open) : openJob(o.dataset.open); return; }
  if (g){
    const x = g.dataset.go;
    if (x==="settings") return openSettings();
    if (x==="new") return openJob(null);
    if (x==="search"){ UI.q=""; UI._refocus=true; goTab("jobs"); return; }
    goTab(x); return;
  }
  if (f){ UI.filter = f.dataset.filter; render(); return; }
  if (d){ UI.day = d.dataset.day === "today" ? todayStr() : addDays(UI.day, +d.dataset.day); render(); return; }
});
$("#view").addEventListener("input", e => { if (e.target.id === "q"){ UI.q = e.target.value; UI._refocus = true; render(); } });

/* ---------- built-in updates (Android app only) ---------- */
const APP_BUILD = Number("__BUILD__") || 0;
const RELEASE_API = "https://api.github.com/repos/aykaufman/hvac-job-book/releases/tags/android-latest";
const APK_URL = "https://github.com/aykaufman/hvac-job-book/releases/download/android-latest/JobBook.apk";
function isNativeApp(){ try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); } catch(e){ return false; } }
let lastCheck = 0;
async function checkForUpdate(manual){
  if (!isNativeApp() || !APP_BUILD) return;
  if (!manual && Date.now() - lastCheck < 30*60*1000) return;
  lastCheck = Date.now();
  const st = document.getElementById("updStatus");
  if (manual && st) st.textContent = "Checking…";
  try {
    const r = await fetch(RELEASE_API, {cache:"no-store", headers:{"Accept":"application/vnd.github+json"}});
    if (!r.ok) throw new Error(r.status);
    const rel = await r.json();
    const m = /build:(\d+)/.exec(rel.body || "");
    const latest = m ? Number(m[1]) : 0;
    const note = (/What's new:\s*(.+)/.exec(rel.body || "") || [])[1] || "";
    let skipped = 0; try { skipped = Number(localStorage.getItem("hvac.skipBuild")) || 0; } catch(e){}
    if (latest > APP_BUILD){
      if (st) st.textContent = `Build ${latest} is ready.`;
      if (manual || latest > skipped){
        $("#updNote").textContent = note ? note : `Build ${latest} · tap Update, then Install`;
        $("#updGo").href = APK_URL;
        $("#updGo").dataset.build = latest;
        $("#upd").classList.add("on");
      }
    } else if (st) st.textContent = "You have the newest version.";
  } catch(e){ if (manual && st) st.textContent = "Couldn't check — no signal?"; }
}
$("#updX").onclick = () => { try { localStorage.setItem("hvac.skipBuild", $("#updGo").dataset.build || "0"); } catch(e){} $("#upd").classList.remove("on"); };
$("#updGo").addEventListener("click", () => { setTimeout(()=>{ $("#upd").classList.remove("on"); toast("Downloading — open the file and tap Install"); }, 300); });
document.addEventListener("click", e => { if (e.target && e.target.id === "checkNow") checkForUpdate(true); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(false); });
setTimeout(() => checkForUpdate(false), 1500);
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
