name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy the app into www
        run: |
          mkdir -p www
          cp index.html jspdf.umd.min.js manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png www/
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html
          grep -q 'Number("${{ github.run_number }}")' www/index.html

      - name: Install Capacitor
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/assets@latest @capacitor/share@latest @capacitor/filesystem@latest

      - name: Create the Android project
        run: npx cap add android

      - name: Make app icons and splash screen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#b04c12' --iconBackgroundColorDark '#b04c12' --splashBackgroundColor '#b04c12' --splashBackgroundColorDark '#b04c12'

      - name: Copy files into the Android project
        run: npx cap sync android

      - name: Use the same signing key every time (so updates install over the old app)
        run: mkdir -p ~/.android && cp android-keys/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JobBook.apk

      - name: Write the update note
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTE=$(printf '%s' "${MSG:-Manual build}" | head -n 1)
          {
            echo "Tap **JobBook.apk** below to download, then open it to install."
            echo
            echo "What's new: $NOTE"
            echo
            echo "build:${{ github.run_number }}"
          } > release-notes.md

      - name: Put it on the download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Job Book for Android (build ${{ github.run_number }})
          body_path: release-notes.md
          files: JobBook.apk
          make_latest: true
          overwrite_files: true
